<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        .bg-decoration {
            position: fixed;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }
        .bg-decoration-2 {
            position: fixed;
            bottom: -50px;
            left: -50px;
            width: 250px;
            height: 250px;
            background: rgba(240,147,251,0.15);
            border-radius: 50%;
            filter: blur(50px);
            animation: float 8s ease-in-out infinite reverse;
            z-index: 1;
        }
        .crystal-decoration {
            position: fixed;
            top: 20%;
            right: 5%;
            width: 60px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(102,126,234,0.2));
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: crystalFloat 10s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.1); }
        }
        @keyframes crystalFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .workbench-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-tab svg { width: 20px; height: 20px; }
        .nav-tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .nav-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        .tool-content {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
            padding: 40px;
            min-height: 500px;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        .tool-content.fade-out {
            opacity: 0;
            transform: translateX(-20px);
        }
        .tool-content.fade-in {
            opacity: 1;
            transform: translateX(0);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
        }
        .length-display {
            min-width: 50px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .checkbox-item:hover { background: #f5f5f5; }
        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .password-display {
            background: linear-gradient(135deg, #f5f5f5, #eee);
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            color: #333;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            flex: 1;
            min-width: 120px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .calculator-display {
            background: linear-gradient(135deg, #2d3748, #1a202c);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-size: 36px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f5f5f5;
            color: #333;
        }
        .calc-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        .calc-btn.operator {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .calc-btn.equals {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            grid-column: span 2;
        }

        .todo-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .todo-input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .todo-input:focus { border-color: #667eea; }
        .todo-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .todo-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }
        .todo-item.completed {
            opacity: 0.6;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        .todo-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        .todo-delete {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #ffebee;
            color: #e53935;
            cursor: pointer;
        }
        .todo-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .chart-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #4caf50 0deg var(--completed-deg, 0deg),
                #ff9800 var(--completed-deg, 0deg) 360deg
            );
            position: relative;
        }
        .pie-chart::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            right: 20%;
            bottom: 20%;
            background: white;
            border-radius: 50%;
        }
        .pie-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1;
        }
        .pie-percentage {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .export-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .tool-content { padding: 25px; }
            h1 { font-size: 24px; }
            .nav-tab { padding: 12px 20px; font-size: 14px; }
            .todo-stats { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="bg-decoration-2"></div>
    <div class="crystal-decoration"></div>

    <div class="workbench-container">
        <div class="nav-tabs">
            <button class="nav-tab active" data-tool="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0110 0v4"></path>
                </svg>
                密码生成器
            </button>
            <button class="nav-tab" data-tool="calculator">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                    <path d="M8 16h8"></path>
                    <path d="M8 12h8"></path>
                    <path d="M8 8h8"></path>
                </svg>
                计算器
            </button>
            <button class="nav-tab" data-tool="todo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                待办事项
            </button>
        </div>

        <div class="tool-content" id="password-tool">
            <h1>密码生成器</h1>
            <div class="form-group">
                <label for="lengthSlider">密码长度: <span id="lengthValue" class="length-display">16</span> 位</label>
                <div class="slider-container">
                    <input type="range" id="lengthSlider" min="4" max="64" value="16">
                </div>
            </div>
            <div class="form-group">
                <label>字符类型:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" id="uppercase" checked><label for="uppercase">大写字母 (A-Z)</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="lowercase" checked><label for="lowercase">小写字母 (a-z)</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="numbers" checked><label for="numbers">数字 (0-9)</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="symbols" checked><label for="symbols">符号 (!@#$%^&*())</label></div>
                </div>
            </div>
            <div class="password-display" id="passwordDisplay">点击生成密码</div>
            <div class="button-group">
                <button class="btn-primary" id="generateBtn">生成密码</button>
                <button class="btn-secondary" id="copyBtn">复制密码</button>
            </div>
        </div>

        <div class="tool-content" id="calculator-tool" style="display: none;">
            <h1>计算器</h1>
            <div class="calculator-display" id="calcDisplay">0</div>
            <div class="calculator-buttons">
                <button class="calc-btn" onclick="calcClear()">C</button>
                <button class="calc-btn" onclick="calcAppend('(')">(</button>
                <button class="calc-btn" onclick="calcAppend(')')">)</button>
                <button class="calc-btn operator" onclick="calcAppend('/')">÷</button>
                <button class="calc-btn" onclick="calcAppend('7')">7</button>
                <button class="calc-btn" onclick="calcAppend('8')">8</button>
                <button class="calc-btn" onclick="calcAppend('9')">9</button>
                <button class="calc-btn operator" onclick="calcAppend('*')">×</button>
                <button class="calc-btn" onclick="calcAppend('4')">4</button>
                <button class="calc-btn" onclick="calcAppend('5')">5</button>
                <button class="calc-btn" onclick="calcAppend('6')">6</button>
                <button class="calc-btn operator" onclick="calcAppend('-')">−</button>
                <button class="calc-btn" onclick="calcAppend('1')">1</button>
                <button class="calc-btn" onclick="calcAppend('2')">2</button>
                <button class="calc-btn" onclick="calcAppend('3')">3</button>
                <button class="calc-btn operator" onclick="calcAppend('+')">+</button>
                <button class="calc-btn" onclick="calcAppend('0')">0</button>
                <button class="calc-btn" onclick="calcAppend('.')">.</button>
                <button class="calc-btn equals" onclick="calcCalculate()">=</button>
            </div>
        </div>

        <div class="tool-content" id="todo-tool" style="display: none;">
            <h1>待办事项</h1>
            <div class="todo-stats">
                <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总任务</div></div>
                <div class="stat-card"><div class="stat-value" id="statCompleted">0</div><div class="stat-label">已完成</div></div>
                <div class="stat-card"><div class="stat-value" id="statPending">0</div><div class="stat-label">待处理</div></div>
            </div>
            <div class="chart-container">
                <div class="pie-chart" id="pieChart">
                    <div class="pie-center"><div class="pie-percentage" id="piePercentage">0%</div><div style="font-size:12px;color:#666">完成率</div></div>
                </div>
            </div>
            <div class="todo-input-area">
                <input type="text" class="todo-input" id="todoInput" placeholder="添加新任务...">
                <button class="btn-primary" onclick="addTodo()">添加</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
            <div class="export-buttons">
                <button class="btn-secondary" onclick="exportTodoJson()">导出 JSON</button>
                <button class="btn-secondary" onclick="exportTodoCsv()">导出 CSV</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const CHAR_SETS = { uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lowercase: 'abcdefghijklmnopqrstuvwxyz', numbers: '0123456789', symbols: '!@#$%^&*()_+-=[]{};:,.<>?' };
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const uppercaseCheckbox = document.getElementById('uppercase');
        const lowercaseCheckbox = document.getElementById('lowercase');
        const numbersCheckbox = document.getElementById('numbers');
        const symbolsCheckbox = document.getElementById('symbols');
        const passwordDisplay = document.getElementById('passwordDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const navTabs = document.querySelectorAll('.nav-tab');
        const toolContents = document.querySelectorAll('.tool-content');

        lengthSlider.addEventListener('input', () => lengthValue.textContent = lengthSlider.value);

        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            let charPool = '';
            let selectedChars = [];
            if (uppercaseCheckbox.checked) { charPool += CHAR_SETS.uppercase; selectedChars.push(CHAR_SETS.uppercase); }
            if (lowercaseCheckbox.checked) { charPool += CHAR_SETS.lowercase; selectedChars.push(CHAR_SETS.lowercase); }
            if (numbersCheckbox.checked) { charPool += CHAR_SETS.numbers; selectedChars.push(CHAR_SETS.numbers); }
            if (symbolsCheckbox.checked) { charPool += CHAR_SETS.symbols; selectedChars.push(CHAR_SETS.symbols); }

            if (selectedChars.length === 0) { passwordDisplay.textContent = '请至少选择一种字符类型'; return; }
            let password = '';
            selectedChars.forEach(chars => { if (password.length < length) password += chars[Math.floor(Math.random() * chars.length)]; });
            while (password.length < length) password += charPool[Math.floor(Math.random() * charPool.length)];
            password = password.split('').sort(() => Math.random() - 0.5).join('');
            passwordDisplay.textContent = password;
            showToast('密码已生成');
        }

        async function copyPassword() {
            const password = passwordDisplay.textContent;
            if (password === '点击生成密码' || password === '请至少选择一种字符类型') return;
            try {
                await navigator.clipboard.writeText(password);
                copyBtn.style.background = '#4caf50';
                copyBtn.textContent = '已复制';
                showToast('已复制到剪贴板');
                setTimeout(() => { copyBtn.style.background = '#f0f0f0'; copyBtn.textContent = '复制密码'; }, 2000);
            } catch (err) { console.error('复制失败:', err); }
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const toolId = tab.dataset.tool;
                navTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                toolContents.forEach(content => {
                    content.classList.add('fade-out');
                    setTimeout(() => { content.style.display = 'none'; content.classList.remove('fade-out'); }, 300);
                });
                setTimeout(() => {
                    const activeTool = document.getElementById(`${toolId}-tool`);
                    activeTool.style.display = 'block';
                    activeTool.classList.add('fade-in');
                    setTimeout(() => activeTool.classList.remove('fade-in'), 500);
                }, 350);
            });
        });

        generateBtn.addEventListener('click', generatePassword);
        copyBtn.addEventListener('click', copyPassword);
        generatePassword();

        let calcDisplay = document.getElementById('calcDisplay');
        function calcAppend(value) {
            if (calcDisplay.textContent === '0' && value !== '.') calcDisplay.textContent = value;
            else calcDisplay.textContent += value;
        }
        function calcClear() { calcDisplay.textContent = '0'; }
        function calcCalculate() {
            try {
                let expression = calcDisplay.textContent.replace('×', '*').replace('÷', '/').replace('−', '-');
                calcDisplay.textContent = eval(expression);
                showToast('计算完成');
            } catch (err) {
                calcDisplay.textContent = '错误';
                showToast('表达式错误');
                setTimeout(() => calcDisplay.textContent = '0', 2000);
            }
        }

        let todos = JSON.parse(localStorage.getItem('todos') || '[]');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const statTotal = document.getElementById('statTotal');
        const statCompleted = document.getElementById('statCompleted');
        const statPending = document.getElementById('statPending');
        const pieChart = document.getElementById('pieChart');
        const piePercentage = document.getElementById('piePercentage');

        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `<input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
                    <span class="todo-text">${todo.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(${index})">删除</button>`;
                todoList.appendChild(li);
            });
            updateStats();
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (text) {
                todos.push({ text, completed: false, id: Date.now() });
                localStorage.setItem('todos', JSON.stringify(todos));
                todoInput.value = '';
                renderTodos();
                showToast('任务已添加');
            }
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
            showToast('任务已删除');
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
            statTotal.textContent = total;
            statCompleted.textContent = completed;
            statPending.textContent = pending;
            piePercentage.textContent = `${percentage}%`;
            pieChart.style.setProperty('--completed-deg', `${(completed / total) * 360}deg`);
        }

        function exportTodoJson() {
            const blob = new Blob([JSON.stringify(todos, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'todos.json'; a.click();
            URL.revokeObjectURL(url);
            showToast('已导出 JSON');
        }

        function exportTodoCsv() {
            let csv = 'ID,任务,状态\n';
            todos.forEach(todo => csv += `${todo.id},"${todo.text}",${todo.completed ? '已完成' : '待处理'}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'todos.csv'; a.click();
            URL.revokeObjectURL(url);
            showToast('已导出 CSV');
        }

        todoInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTodo(); });
        renderTodos();
    </script>
</body>
</html>
